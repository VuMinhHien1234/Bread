# Kiểm tra mỗi lần push / mở pull request: typecheck → lint → test → build (CODING-RULES mục 15).
# Không cần secret: build không đọc biến môi trường thật, test dùng Postgres giả lập (PGlite).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra định dạng (Prettier)
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
